set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 10000
set -g escape-time 0
set -g focus-events on

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# catppuccin mocha palette
# base #1e1e2e, text #cdd6f4, blue #89b4fa, yellow #f9e2af, green #a6e3a1, lavender #b4befe, overlay0 #6c7086

set -g status-position top
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-left "#[fg=#89b4fa,bold]#S "
set -g status-right "#[fg=#f9e2af]%H:%M #[fg=#b4befe]%d-%b"
set -g window-status-current-style "fg=#a6e3a1,bold"
set -g window-status-style "fg=#6c7086"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
