// Firefox autoconfig. Must start with a comment line. Runs in privileged chrome
// context on startup, before profile prefs are applied.
var { classes: Cc, interfaces: Ci, utils: Cu } = Components;

// Route new tabs (Cmd+T, middle-click, etc.) to the local Mocha page. This uses
// Firefox's internal AboutNewTab module instead of the WebExtension API, so it
// bypasses the file:// restriction Mozilla applied to extensions.
try {
  ChromeUtils.importESModule(
    "resource:///modules/AboutNewTab.sys.mjs",
  ).AboutNewTab.newTabURL = "__NEWTAB_URL__";
} catch (e) {
  Cu.reportError(e);
}

// Focus the page content on new-tab open instead of the URL bar so the loaded
// page is interactive immediately.
try {
  const { BrowserWindowTracker } = ChromeUtils.importESModule(
    "resource:///modules/BrowserWindowTracker.sys.mjs",
  );
  const Services = globalThis.Services;
  Services.obs.addObserver(() => {
    const win = BrowserWindowTracker.getTopWindow();
    if (win && win.gBrowser && win.gBrowser.selectedBrowser) {
      win.gBrowser.selectedBrowser.focus();
    }
  }, "browser-open-newtab-start");
} catch (e) {
  Cu.reportError(e);
}
