// Firefox autoconfig. Must start with a comment line. Runs in privileged chrome
// context on startup, before profile prefs are applied.
var { classes: Cc, interfaces: Ci, utils: Cu } = Components;

// Route new tabs (Cmd+T, middle-click, etc.) to the local Mocha page. This uses
// Firefox's internal AboutNewTab module instead of the WebExtension API, so it
// bypasses the file:// restriction Mozilla applied to extensions.
try {
  ChromeUtils.importESModule(
    "resource:///modules/AboutNewTab.sys.mjs",
  ).AboutNewTab.newTabURL = "__NEWTAB_URL__";
} catch (e) {
  Cu.reportError(e);
}

// On new-tab open and on new-window startup, wait for Firefox to write the
// homepage URL into the bar (signalled by onLocationChange), then clear and
// focus. Listener self-detaches after the first non-empty location change.
try {
  const attach = (win) => {
    const listener = {
      onLocationChange() {
        if (!win.gURLBar.value) return;
        win.gBrowser.removeTabsProgressListener(listener);
        win.gURLBar.value = "";
        win.gURLBar.focus();
      },
    };
    win.gBrowser.addTabsProgressListener(listener);
  };
  Services.obs.addObserver(() => {
    const win = Services.wm.getMostRecentBrowserWindow();
    if (win) attach(win);
  }, "browser-open-newtab-start");
  Services.obs.addObserver({
    observe(win) {
      win.addEventListener("load", () => {
        if (win.gBrowser) attach(win);
      }, { once: true });
    },
  }, "domwindowopened");
} catch (e) {
  Cu.reportError(e);
}
