[settings]
trusted_config_paths = ["~/repositories"]
auto_install = true
jobs = 4

[tools]
# runtimes
go = "1.26"
node = "24.16"
python = "3.14"
bun = "1.3"
dotnet = "10.0"
rust = "1.96"
zig = "0.16"
lua = "5.4"
luajit = "2.1"

# python toolchain
uv = "0.11"

# infrastructure
terraform = "1.15"
opentofu = "1.12"
sops = "3.13"

# kubernetes
kubectl = "1.36"
helm = "4.2"
kustomize = "5.8"
kubeconform = "0.8"

# linters and formatters
pre-commit = "4.6"
actionlint = "1.7"
tflint = "0.63"
golangci-lint = "2.12"
hadolint = "2.14"
prettier = "3.8"
markdownlint-cli2 = "0.22"

# utilities
yq = "4.53"
restic = "0.18"
sqlite = "3.53"
