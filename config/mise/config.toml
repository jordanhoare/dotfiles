[settings]
trusted_config_paths = ["~/repositories", "/mnt/d/repositories"]
auto_install = true
jobs = 4
python.compile = false

[tools]
# runtimes
go = "1.26.10"
node = "26.13.0"
python = "3.14.10"
bun = "1.3.14"
dotnet = "10.0.403"
rust = "1.96.1"
zig = "0.16.0"

# python toolchain
uv = "0.11.33"

# infrastructure
terraform = "1.15.9"
opentofu = "1.12.9"
sops = "3.13.3"

# kubernetes
kubectl = "1.36.5"
helm = "4.2.4"
kustomize = "5.8.3"
kubeconform = "0.8.0"
k9s = "0.51.0"
argocd = "3.4.12"
kubectx = "0.11.0"
flux2 = "2.8.8"

# cloud
localstack = "2026.5.0"
vault = "2.0.4"

# linters and formatters
shellcheck = "0.11.0"
shfmt = "3.14.1"
actionlint = "1.7.12"
tflint = "0.63.1"
golangci-lint = "2.12.2"
gofumpt = "0.10.0"
hadolint = "2.14.0"
stylua = "2.5.2"
biome = "2.4.16"

# language servers
terraform-ls = "0.38.8"

# build tools
cmake = "4.3.6"
conan = "2.29.1"

# utilities
yq = "4.53.6"
restic = "0.18.1"
sqlite = "3.53.4"
