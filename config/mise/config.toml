[settings]
trusted_config_paths = ["~/repositories"]
auto_install = true
jobs = 4
python.compile = false

[tools]
# runtimes
go = "1.26"
node = "24.16"
python = "3.14"
bun = "1.3"
dotnet = "10.0"
rust = "1.96"
zig = "0.16"

# python toolchain
uv = "0.11"

# infrastructure
terraform = "1.15"
opentofu = "1.12"
sops = "3.13"

# kubernetes
kubectl = "1.36"
helm = "4.2"
kustomize = "5.8"
kubeconform = "0.8"
k9s = "0.51"
argocd = "3.4"
kubectx = "0.11"
flux2 = "2.8"

# cloud
localstack = "2026.5"
vault = "2.0"

# linters and formatters
pre-commit = "4.6"
actionlint = "1.7"
tflint = "0.63"
golangci-lint = "2.12"
gofumpt = "0.10"
hadolint = "2.14"
stylua = "2.5"
biome = "2.4"

# language servers
lua-language-server = "3.18"
terraform-ls = "0.38"

# build tools
cmake = "4.3"

# utilities
yq = "4.53"
restic = "0.18"
sqlite = "3.53"
