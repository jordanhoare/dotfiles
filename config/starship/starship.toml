format = """
$directory\
$git_branch\
$env_var\
$git_status\
$fill\
$python\
$lua\
$nodejs\
$golang\
$haskell\
$rust\
$ruby\
$package\
$aws\
$gcloud\
$azure\
$docker_context\
$jobs\
$cmd_duration\
$line_break\
$character"""

add_newline = true
palette = 'catppuccin_mocha'

[directory]
style = 'bold fg:dark_blue'
format = '[$path ]($style)'
truncation_length = 100
truncation_symbol = ''
truncate_to_repo = false

[git_branch]
style = 'fg:green'
symbol = '🌿 '
format = '[on](white) [$symbol$branch ]($style)'

[git_status]
style = 'fg:green'
format = '([ahead_behind]($style) )'

[fill]
symbol = ' '

[python]
style = 'teal'
symbol = '🐍 '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ''

[lua]
symbol = '🌙 '

[nodejs]
style = 'blue'
symbol = '🟢 '

[golang]
style = 'blue'
symbol = '🐹 '

[haskell]
style = 'blue'
symbol = '🎩 '

[rust]
style = 'orange'
symbol = '⚙️ '

[ruby]
style = 'blue'
symbol = '💎 '

[package]
symbol = '📦 '

[aws]
symbol = '🟡 '
style = 'yellow'
format = '[$symbol($profile )(\[$duration\] )]($style)'

[gcloud]
symbol = '☁️ '
style = 'blue'
format = '[$symbol $project ]($style)'

[azure]
symbol = '🔷 '
style = 'blue'
format = '[$symbol($subscription )]($style)'

[docker_context]
symbol = '🐳 '
style = 'fg:#06969A'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

[jobs]
symbol = '⚙️ '
style = 'red'
number_threshold = 1
format = '[$symbol]($style)'

[cmd_duration]
min_time = 500
style = 'fg:gray'
format = '[$duration]($style)'

[palettes.catppuccin_mocha]
dark_blue = '#89b4fa'
blue = '#74c7ec'
teal = '#94e2d5'
red = '#f38ba8'
orange = '#fab387'
green = '#a6e3a1'
yellow = '#f9e2af'
purple = '#cba6f7'
gray = '#6c7086'
black = '#1e1e2e'
white = '#cdd6f4'

[env_var]
style = 'fg:green'
variable = 'STARSHIP_GIT_USER'
format = '[\($env_value\) ]($style)'
