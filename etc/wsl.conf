# /etc/wsl.conf - WSL distro-level config, applied per-distro.
# Synced to /etc/wsl.conf by the home-manager wslConfSync activation in
# nix/modules/wsl.nix. After changes, run 'wsl --shutdown' on Windows
# to restart the distro and pick up the new config.

[user]
default = jordanhoare

[boot]
systemd = true

[automount]
enabled = true
root = /mnt/
options = "metadata,uid=1000,gid=1000,umask=022,fmask=111"
