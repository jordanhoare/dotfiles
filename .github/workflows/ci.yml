name: ci

on:
  push:
    branches: [main]
    paths:
      - nix/**
      - home/**
      - config/**
      - bin/**
      - Makefile
      - .github/workflows/ci.yml
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            macos:
              - nix/modules/macos.nix
              - nix/modules/macos-system.nix
              - nix/flake.nix
              - nix/flake.lock

  # Rung 4: build, activate as the runner user, and smoke-test the dotfiles.
  # Runs with no secrets - exercises only the unprivileged "stranger clones the repo" path.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: flake check (pure eval)
        run: nix flake check ./nix

      # Build-only: Home Manager enforces home.username matches the running user,
      # so activation with a hardcoded username cannot run on the CI runner.
      # Building the activation package validates all nix expressions and nixpkgs
      # references without requiring a matching user environment.
      - name: build linux + wsl activation packages
        run: |
          nix build --impure ./nix#homeConfigurations."linux".activationPackage
          nix build --impure ./nix#homeConfigurations."wsl".activationPackage

      - name: nvim config validity (no plugin bootstrap)
        run: nix run nixpkgs#stylua -- --check config/nvim/

      - name: guard - plaintext secret is never tracked
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch config/git/private 2>/dev/null; then
            echo "FATAL: plaintext config/git/private is tracked by git"; exit 1
          fi

  # Rung 2: macOS builds only (activating a nix-darwin system in CI is slow and fragile).
  # Gated to changes that can affect the macOS config.
  macos:
    runs-on: macos-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.macos == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: flake check (pure eval)
        run: nix flake check ./nix

      - name: build macos system
        run: nix build --impure ./nix#darwinConfigurations."macos".system
