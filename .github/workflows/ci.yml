name: ci

on:
  push:
    branches: [main]
    paths:
      - nix/**
      - home/**
      - config/**
      - bin/**
      - win/**
      - .mise/**
      - install.sh
      - install.ps1
      - .github/workflows/ci.yml
      - .github/actions/**
      - .github/workflows/renovate.yml
      - .github/renovate-config.json5
  pull_request:
    paths:
      - nix/**
      - home/**
      - config/**
      - bin/**
      - win/**
      - .mise/**
      - install.sh
      - install.ps1
      - .github/workflows/ci.yml
      - .github/actions/**
      - .github/workflows/renovate.yml
      - .github/renovate-config.json5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's files through the api.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
      renovate: ${{ steps.filter.outputs.renovate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            macos:
              - nix/modules/**
              - nix/flake.nix
              - nix/flake.lock
              - .mise/**
            renovate:
              - .github/workflows/renovate.yml
              - .github/renovate-config.json5

  # Runs with no secrets, so it covers only what a stranger cloning the repo gets.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans every commit, not just the tip.
          fetch-depth: 0
      - uses: ./.github/actions/nix-and-mise

      - name: tasks parse and dispatch
        run: |
          mise tasks ls
          mise run --dry-run bootstrap
          mise run --dry-run apply 2>&1 | grep -F 'apply:linux'

      - name: lint and format hooks
        run: mise exec -- prek run --all-files --show-diff-on-failure

      # The gitleaks hook scans staged changes only, and CI stages nothing.
      - name: secret scan over the full history
        run: mise exec -- gitleaks git --redact --no-banner

      # Nothing in ci installs the baseline; this resolves every pin a renovate bump touches.
      - name: baseline pins resolve and win/mise.toml mirrors the baseline
        run: mise run check:pins

      - name: flake check (pure eval)
        run: nix flake check ./nix

      # Build-only: Home Manager enforces home.username matches the running user,
      # so activation with a hardcoded username cannot run on the CI runner.
      # Building the activation package validates all nix expressions and nixpkgs
      # references without requiring a matching user environment.
      - name: build linux + wsl activation packages
        run: |
          nix build ./nix#homeConfigurations."linux".activationPackage
          nix build ./nix#homeConfigurations."wsl".activationPackage

      - name: guard - plaintext secret is never tracked
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch config/git/private 2>/dev/null; then
            echo "FATAL: plaintext config/git/private is tracked by git"; exit 1
          fi

  # Build only: activating a nix-darwin system in CI is slow and fragile.
  macos:
    runs-on: macos-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.macos == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-and-mise

      - name: tasks parse and dispatch
        run: |
          mise tasks ls
          mise run --dry-run apply 2>&1 | grep -F 'apply:macos'

      - name: flake check (pure eval)
        run: nix flake check ./nix

      - name: build macos system
        run: nix build ./nix#darwinConfigurations."macos".system

  # Windows has no Nix. Checks that the task config parses there, that the
  # .ps1 pairs are what Windows runs, and that every PowerShell script parses.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: false

      - name: tasks parse and dispatch
        shell: pwsh
        run: |
          mise tasks ls
          $nix = mise run nix 2>&1 | Out-String
          if ($nix -notmatch 'not used on windows') { throw "nix.ps1 did not run: $nix" }
          $apply = mise run --dry-run apply 2>&1 | Out-String
          if ($apply -notmatch 'apply\.ps1') { throw "apply did not dispatch to apply.ps1: $apply" }

      - name: powershell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Recurse -Include *.ps1 -Path install.ps1, win, .mise) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) { $failed = $true; Write-Host "$($file.FullName):"; $errors | ForEach-Object { Write-Host "  $($_.Message)" } }
          }
          if ($failed) { exit 1 }

  # Validates the policy and logs the pull requests the scheduled run would open, with no token
  # that can write.
  renovate:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.renovate == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          configurationFile: .github/renovate-config.json5
          token: ${{ secrets.GITHUB_TOKEN }}
          renovate-version: 44.192.2
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Renovate clones the repository itself and reads main; this points it at the pull request.
          RENOVATE_BASE_BRANCHES: ${{ github.head_ref }}
          RENOVATE_DRY_RUN: full
          LOG_LEVEL: debug
